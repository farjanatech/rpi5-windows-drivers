name: Build Universal C1-D0 Graphics Release

on:
  push:
    branches:
      - damian-edition
    paths:
      - 'pi5-graphics/**'
      - '.github/workflows/build-damian-edition-graphics.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify universal C1/D0 source invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python pi5-graphics/tests/check-universal-invariants.py
          if($LASTEXITCODE){throw 'Universal source invariant check failed'}

      - name: Install WDK 26100 if needed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $wdk='C:\Program Files (x86)\Windows Kits\10'
          $ntddk="$wdk\Include\10.0.26100.0\km\ntddk.h"
          if(!(Test-Path $ntddk)){
            winget install --id Microsoft.WindowsWDK.10.0.26100 -e --silent --accept-package-agreements --accept-source-agreements
            if($LASTEXITCODE){throw "WDK installation failed with exit code $LASTEXITCODE"}
          }
          $required=@(
            "$wdk\Include\10.0.26100.0\km\ntddk.h",
            "$wdk\Lib\10.0.26100.0\km\arm64\ntoskrnl.lib",
            "$wdk\Lib\10.0.26100.0\km\arm64\displib.lib",
            "$wdk\bin\10.0.26100.0\x86\Inf2Cat.exe"
          )
          foreach($p in $required){if(!(Test-Path $p)){throw "Missing WDK prerequisite after install: $p"}}

      - name: Run V3D revision encoder regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item Build -ItemType Directory -Force | Out-Null
          $vswhere='C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(!$vs){throw 'Visual Studio x64 C++ tools not found'}
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $cmd='call "'+$vcvars+'" && cl /nologo /EHsc /std:c++20 /W4 /WX pi5-graphics\tests\encoder-revision-test.cpp /Fe:Build\encoder-revision-test.exe && Build\encoder-revision-test.exe'
          & cmd.exe /d /s /c $cmd
          if($LASTEXITCODE){throw 'V3D revision encoder regression failed'}

      - name: Create universal test signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Farjanatech RPi5 Universal Graphics Test' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          "CERT_THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Export-Certificate -Cert $cert -FilePath Build\Farjanatech-RPi5-Universal-Graphics-Test.cer | Out-Null

      - name: Build and sign ARM64 universal graphics package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\build.ps1 -Driver pi5-graphics -Output (Join-Path $PWD 'Build') -Configuration Release -SdkVersion '10.0.26100.0' -WdkVersion '10.0.26100.0' -CertificateThumbprint $env:CERT_THUMB
          Get-ChildItem Build\pi5-graphics | Format-Table Name,Length

      - name: Verify release identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Select-String -Path Build\pi5-graphics\pi5graphics.inf -Pattern '1.0.0.0','ACPI\\RPI1001'
          foreach($f in @('Pi5Graphics.sys','Pi5GraphicsPower.sys','Pi5D3D.dll','pi5graphics.cat')){if(!(Test-Path (Join-Path 'Build\pi5-graphics' $f))){throw "Missing package file: $f"}}

      - name: Assemble universal release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='Build\RPi5-Universal-Graphics-C1-D0-1.0.0'
          $payload=Join-Path $root 'Payload\Graphics'
          New-Item $payload -ItemType Directory -Force | Out-Null
          foreach($f in @('Pi5Graphics.sys','Pi5GraphicsPower.sys','Pi5D3D.dll','pi5graphics.inf','pi5graphics.cat','LICENSE.txt','EDID-LICENSE.txt')){
            Copy-Item (Join-Path 'Build\pi5-graphics' $f) $payload -Force
          }
          Copy-Item Build\Farjanatech-RPi5-Universal-Graphics-Test.cer $payload -Force
          Copy-Item pi5-graphics\UNIVERSAL-RELEASE-README.md (Join-Path $root 'README.md') -Force
          @(
            'RPi5 Universal Graphics C1/D0 1.0.0.0',
            'Branch: damian-edition',
            ('Commit: '+$env:GITHUB_SHA),
            'Functional baseline: 0.1.0.179 C1 DESKTOP_CLEAN',
            'Damian reference: damian5466/rpi5-windows-drivers add-complete-graphics-release 7e06714c188832a94174ef72a81d51eb0a067bce',
            'C1 hardware validated; D0 source/regression compatible, not physically validated in this project.'
          ) | Set-Content (Join-Path $root 'BUILD-PROVENANCE.txt') -Encoding UTF8
          Get-ChildItem $root -Recurse -File | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash,($_.FullName.Substring((Resolve-Path $root).Path.Length+1))
          } | Set-Content (Join-Path $root 'SHA256SUMS.txt') -Encoding ASCII
          $zip='Build\RPi5-Universal-Graphics-C1-D0-1.0.0.zip'
          Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: RPi5-Universal-Graphics-C1-D0-1.0.0
          path: Build/RPi5-Universal-Graphics-C1-D0-1.0.0.zip
          if-no-files-found: error
