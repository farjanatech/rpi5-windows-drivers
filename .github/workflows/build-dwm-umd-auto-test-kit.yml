name: Build DWM 2-Thread Epilogue Fix Test Kit v9

on:
  push:
    branches:
      - dwm-2thread-epilogue-fix-v9
    paths:
      - 'pi5-graphics/**'
      - 'tools/dwm-umd-auto-test-kit/**'
      - '.github/workflows/build-dwm-umd-auto-test-kit.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify product-code scope and C1/D0 invariants
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='c4d7a9feaeaa99f032547e33462ad056a4508c14'
          $product=@(git diff --name-only $base HEAD -- pi5-graphics)
          $allowed=@(
            'pi5-graphics/native/umd.cpp',
            'pi5-graphics/native/umd.h',
            'pi5-graphics/native/abi.h',
            'pi5-graphics/native/shader.cpp',
            'pi5-graphics/native/encode.cpp',
            'pi5-graphics/native/encode.h',
            'pi5-graphics/native/validate.cpp',
            'pi5-graphics/native/validate.h',
            'pi5-graphics/native/qpu-alu.h',
            'pi5-graphics/kmd/gpu.cpp',
            'pi5-graphics/tests/encoder-revision-test.cpp',
            'pi5-graphics/tests/shader-varying-sqrt-test.cpp'
          )
          $unexpected=@($product|Where-Object {$_ -notin $allowed})
          if($unexpected.Count){throw ('Unexpected graphics product-code changes: '+($unexpected -join ', '))}
          python pi5-graphics/tests/check-universal-invariants.py
          if($LASTEXITCODE){throw 'Universal source invariant check failed'}
          $umd=Get-Content pi5-graphics/native/umd.cpp -Raw
          foreach($needle in @('PersistFirstFatal','RecordCall','umd-first-fatal-','unsupported-dxgi','RequireDiagnostic','diagnosticReason')){
            if($umd -notmatch [regex]::Escape($needle)){throw "Missing UMD diagnostic invariant: $needle"}
          }
          $abi=Get-Content pi5-graphics/native/abi.h -Raw
          if($abi -notmatch '#define\s+PI5_MAX_VERTEX_SCALARS\s+32u'){throw 'Vertex scalar limit is not 32'}
          if($abi -notmatch '#define\s+PI5_MAX_VARYINGS\s+32u'){throw 'Varying scalar limit is not 32'}
          if($abi -notmatch 'Pi5ValidVaryingMasks'){throw 'Safe 32-bit varying-mask validation is missing'}
          $validator=Get-Content pi5-graphics/native/validate.cpp -Raw
          if($validator -notmatch 'UINT64_C\(63\)<<6'){throw 'QPU vertex attribute scalar mask is not six bits'}
          $encoder=Get-Content pi5-graphics/native/encode.cpp -Raw
          if($encoder -notmatch 'VaryingFlags' -or $encoder -notmatch 'PI5_VARYING_FLAG_CHUNK'){throw 'Multi-packet varying flags are missing'}
          $shader=Get-Content pi5-graphics/native/shader.cpp -Raw
          if($shader -notmatch 'op == 75' -or $shader -notmatch 'Op::Rsqrt'){throw 'DXBC SQRT lowering is missing'}
          if($shader -notmatch 'op == 25' -or $shader -notmatch 'Op::Exp'){throw 'DXBC EXP lowering is missing'}
          if($shader -notmatch 'op == 47' -or $shader -notmatch 'Op::Log'){throw 'DXBC LOG lowering is missing'}
          if($validator -notmatch 'b!=34' -or $validator -notmatch 'b!=35'){throw 'EXP/LOG SFU selectors are not validated'}
          if($shader -notmatch 'liveVertexAttributes' -or $shader -notmatch 'LoadVertexAttribute' -or
             $shader -notmatch 'loadedVertexAttributes<liveVertexAttributes'){throw 'Lazy vertex-input register-pressure fix is missing'}
          if($shader -notmatch 'registerLimit' -or $shader -notmatch 'limits\[2\]=\{32u,64u\}'){throw '64-register vertex fallback is missing'}
          $validate=Get-Content pi5-graphics/native/validate.h -Raw
          if($validate -notmatch 'uint64_t \*registers'){throw 'Validator register mask is not 64-bit'}
          $gpu=Get-Content pi5-graphics/kmd/gpu.cpp -Raw
          if($gpu -notmatch '0xffffffff00000000' -or $gpu -notmatch 'fourThreadMask'){throw 'KMD thread-mode selection is missing'}
          if($gpu -notmatch 'finalThreadMask' -or $gpu -notmatch 'i==1&&!patches.count'){throw '64-register final-section selection is missing'}
          $encodeh=Get-Content pi5-graphics/native/encode.h -Raw
          if($encodeh -notmatch 'finalThreadMask'){throw 'Draw final-thread mask is missing'}
          if($shader -notmatch 'finalSectionVertex' -or $shader -notmatch '!internalThreadSwitch'){throw 'Corrected 2-thread vertex epilogue is missing'}

      - name: Parse automatic test PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $failed=$false
          Get-ChildItem tools/dwm-umd-auto-test-kit -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if($errors.Count){
              $failed=$true
              Write-Host "PARSE FAIL: $($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            } else {
              Write-Host "PARSE PASS: $($_.Name)"
            }
          }
          if($failed){throw 'Automatic test kit PowerShell parse failed'}

      - name: Install WDK 26100 if needed
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $wdk='C:\Program Files (x86)\Windows Kits\10'
          $ntddk="$wdk\Include\10.0.26100.0\km\ntddk.h"
          if(!(Test-Path $ntddk)){
            winget install --id Microsoft.WindowsWDK.10.0.26100 -e --silent --accept-package-agreements --accept-source-agreements
            if($LASTEXITCODE){throw "WDK installation failed with exit code $LASTEXITCODE"}
          }

      - name: Run V3D encoder and shader regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item Build -ItemType Directory -Force | Out-Null
          $vswhere='C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(!$vs){throw 'Visual Studio x64 C++ tools not found'}
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $cmd='call "'+$vcvars+'" && cl /nologo /EHsc /std:c++20 /W4 /WX pi5-graphics\tests\encoder-revision-test.cpp /Fe:Build\encoder-revision-test.exe && Build\encoder-revision-test.exe && cl /nologo /EHsc /std:c++20 /W4 /WX pi5-graphics\tests\shader-varying-sqrt-test.cpp pi5-graphics\native\shader.cpp pi5-graphics\native\validate.cpp /Fe:Build\shader-varying-sqrt-test.exe /link d3dcompiler.lib && Build\shader-varying-sqrt-test.exe'
          & cmd.exe /d /s /c $cmd
          if($LASTEXITCODE){throw 'V3D encoder/shader regression failed'}

      - name: Create auto-test signing certificate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Farjanatech RPi5 DWM UMD Diagnostic Test' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(1)
          "CERT_THUMB=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Export-Certificate -Cert $cert -FilePath Build\Farjanatech-RPi5-DWM-UMD-Diagnostic-Test.cer | Out-Null

      - name: Build and sign ARM64 diagnostic graphics payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\build.ps1 -Driver pi5-graphics -Output (Join-Path $PWD 'Build') -Configuration Release -SdkVersion '10.0.26100.0' -WdkVersion '10.0.26100.0' -CertificateThumbprint $env:CERT_THUMB
          foreach($f in @('Pi5Graphics.sys','Pi5GraphicsPower.sys','Pi5D3D.dll','pi5graphics.inf','pi5graphics.cat')){
            if(!(Test-Path (Join-Path 'Build\pi5-graphics' $f))){throw "Missing payload file: $f"}
          }

      - name: Assemble one-click automatic test kit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root='Build\RPi5-DWM-2Thread-Epilogue-Fix-Test-Kit-v9.0'
          $payload=Join-Path $root 'Payload\Graphics'
          New-Item $root,$payload -ItemType Directory -Force | Out-Null

          Copy-Item tools\dwm-umd-auto-test-kit\* $root -Force
          foreach($f in @('Pi5Graphics.sys','Pi5GraphicsPower.sys','Pi5D3D.dll','pi5graphics.inf','pi5graphics.cat','LICENSE.txt','EDID-LICENSE.txt')){
            Copy-Item (Join-Path 'Build\pi5-graphics' $f) $payload -Force
          }
          Copy-Item Build\Farjanatech-RPi5-DWM-UMD-Diagnostic-Test.cer $payload -Force

          @(
            'RPi5 DWM 2-Thread Epilogue Fix Test Kit v9.0',
            ('Branch: '+$env:GITHUB_REF_NAME),
            ('Commit: '+$env:GITHUB_SHA),
            'Universal Graphics base: c4d7a9feaeaa99f032547e33462ad056a4508c14',
            'Prior clean-v7 fixes retained: 32 vertex inputs, lazy loads, 32 varyings, SQRT/EXP/LOG and RF32-RF63 vertex fallback.',
            'v7.3 captured failing Month-selector program: VS 0x7e103b42 + PS 0xe86ffe32, 917 QPU words, 101 uniforms, 28 varyings, using RF32-RF63.',
            'Offline audit: captured program ends VPM stores -> THRSW,THRSW -> NOP -> NOP,THRSW,NOP,NOP.',
            'Mesa V3D semantics: start-in-final-thread-section means last-THRSW is already satisfied; a consecutive THRSW pair there is invalid, while a single later THRSW is the program-end switch.',
            'Fix: high-register vertex shaders with no internal TMU switch start in final section and omit the old consecutive last-THRSW pair, retaining only the program-end THRSW and delay slots.',
            'CI requires the high-register stress shader to contain exactly one THRSW and the matching state-record final-section bit.',
            'First-fatal diagnostics remain enabled.',
            'Build configuration: Release ARM64',
            'Automatic flow: install -> reboot -> record -> open Date & time -> finalize -> exact-INF rollback -> verify.'
          ) | Set-Content (Join-Path $root 'BUILD-PROVENANCE.txt') -Encoding UTF8

          Get-ChildItem $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(),($_.FullName.Substring((Resolve-Path $root).Path.Length+1).Replace('\','/'))
          } | Set-Content (Join-Path $root 'SHA256SUMS.txt') -Encoding ASCII

          $zip='Build\RPi5-DWM-2Thread-Epilogue-Fix-Test-Kit-v9.0.zip'
          Compress-Archive -Path "$root\*" -DestinationPath $zip -CompressionLevel Optimal -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: RPi5-DWM-2Thread-Epilogue-Fix-Test-Kit-v9.0
          path: Build/RPi5-DWM-2Thread-Epilogue-Fix-Test-Kit-v9.0.zip
          if-no-files-found: error
